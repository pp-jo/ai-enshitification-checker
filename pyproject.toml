[project]
name = "aimeter"
version = "0.3.0"
description = "CLI tool to check AI model scores from AI Stupid Meter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aimeter = "aimeter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimeter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
exclude-newer = "2 weeks"
